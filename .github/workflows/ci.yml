name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21", "25" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test
        run: mvn -B --no-transfer-progress test

      - name: Package
        if: matrix.java == '17'
        run: mvn -B --no-transfer-progress package -DskipTests

      - name: Compile the examples
        if: matrix.java == '17'
        run: |
          javac -Xlint:all -cp target/classes -d target/examples examples/*.java
